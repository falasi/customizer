plugins {
    id("java")
    id("io.freefair.lombok") version "8.6"
}

sourceCompatibility = JavaVersion.VERSION_21
targetCompatibility = JavaVersion.VERSION_21

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
    maven {
        url "https://jitpack.io"
    }
}

dependencies {
    compileOnly 'net.portswigger.burp.extensions:montoya-api:2023.12.1'
    implementation 'com.rover12421.opensource:JFontChooser:1.0.5-3'
    implementation 'com.github.CoreyD97:Burp-Montoya-Utilities:2993e293'
    implementation 'com.formdev:flatlaf-intellij-themes:2.4'
    compileOnly 'com.formdev:flatlaf:2.4' //Already shipped in burp
    implementation 'com.formdev:flatlaf-extras:2.4' //Already implemented in burp
    compileOnly files('burpsuite_pro.jar')

    //Tests load themes through the real FlatLaf path, so they need the classes Burp provides
    //at runtime. burp.theme.* is stood in for by src/test/java/burp/theme.
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'com.formdev:flatlaf:2.4'
    testImplementation 'net.portswigger.burp.extensions:montoya-api:2023.12.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "failed", "skipped"
    }
}

//Fat jar. burpsuite_pro.jar and flatlaf are compileOnly, so they are never packaged;
//flatlaf-extras is packaged because Burp does not reliably expose it to extensions.
jar {
    archiveBaseName = project.name
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
}

task testJar(type: Jar) {
    archiveBaseName = project.name + "-TEST"
    from { configurations.testCompile.collect { it.isDirectory() ? it : zipTree(it) } }
    with jar
}

tasks.withType(Jar) {
    destinationDirectory = file("$rootDir/releases")
}
