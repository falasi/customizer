# A broken reference which cannot be repaired by supplying a missing definition:
# the key is defined, it just resolves to itself. FlatLaf throws "endless recursion"
# out of getDefaults(). Used to prove that a hopeless Burp defaults layer degrades to
# a working theme instead of failing the whole look and feel.
ColorPalette.endlessRecursion = $ColorPalette.endlessRecursion
Burp.unfixable = $ColorPalette.endlessRecursion
