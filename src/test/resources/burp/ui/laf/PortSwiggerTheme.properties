# A key which only exists in this stand-in's properties file, so a test can tell whether the
# extension discovered these classes and loaded their defaults.
Burp.modernPropertiesKey = #0a0b0c
# ... and the same unresolvable reference modern Burp makes, under the new class names.
Burp.modernSeparator = $ColorPalette.colorSeparator
# Chrome painted with Burp's branding, via a swatch only Burp's own defaults can see.
Burp.modernAccentBar = @Colors.swatches.orange.core
Burp.modernFocusRing = @Colors.swatches.orange.core
# ... and a state colour, which has to stay a state colour.
Burp.modernErrorForeground = @Colors.swatches.red.core
# Core UI defaults Burp derives from a colour only its own theme json defines, written with
# FlatLaf's optional reference syntax. Under any other theme the reference does not resolve,
# and an unresolved optional reference is null - which deletes the key it defines.
Panel.background = $?ColorPalette.colorToolBackground
Burp.modernOptionalReference = $?ColorPalette.colorToolBackground
