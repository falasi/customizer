# Stand-in for Burp's own UI defaults. Every value here is modelled on the shape of the
# real thing rather than its exact contents: the point is that Burp references named
# colours from its own theme json, which a third party theme does not define.

# References which nothing else defines - these are what used to abort the whole
# look and feel with "variable or property 'ColorPalette.colorSeparator' not found".
Separator.foreground = $ColorPalette.colorSeparator
Burp.tableFilterBarBorder = $ColorPalette.colorSeparator
Burp.regressionSeparator = $ColorPalette.colorSeparator
Burp.regressionEditorBackground = $ColorPalette.editorBackground
Burp.regressionDisabledText = $ColorPalette.colorDisabledForeground
Burp.regressionSelection = $ColorPalette.colorSelectionBackground
# ... including one reached through a variable, and one nested inside a colour function.
@burpRegressionToolBackground = $ColorPalette.colorToolBackground
Burp.regressionToolBackground = @burpRegressionToolBackground
Burp.regressionDerived = darken($ColorPalette.colorSeparator,10%)
# ... and one Burp defines with the British spelling it uses elsewhere.
Burp.regressionMono = $ColourPalette.mono9

# A plain value, so tests can tell whether Burp's defaults were loaded at all.
Burp.burpOrange = #ff6633

# A palette colour Burp does define itself, light/dark specific. The fallbacks must not
# clobber it.
[dark]ColorPalette.colorDefined = #123456
[light]ColorPalette.colorDefined = #654321
Burp.regressionDefined = $ColorPalette.colorDefined

# A plain value which the extension does not remap, so tests can tell whether Burp's own
# properties were loaded at all.
Burp.burpOrangeUnmapped = #ff6633

# A palette colour Burp only defines for dark themes: light themes must get a fallback
# rather than an unresolvable reference.
[dark]ColorPalette.colorDarkOnly = #abcdef
Burp.regressionDarkOnly = $ColorPalette.colorDarkOnly
